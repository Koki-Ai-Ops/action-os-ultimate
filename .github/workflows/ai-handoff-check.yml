name: AI handoff test

on:
  pull_request:
    paths:
      - 'scripts/ai-handoff*.mjs'
      - '.github/workflows/ai-handoff-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run handoff tests
        run: node --test scripts/ai-handoff.test.mjs
